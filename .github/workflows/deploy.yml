
name: Build and Deploy NeXkiT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract both projects
        run: |
          unzip -o NeXkiT-React-Project.zip -d .
          unzip -o nexkit-advanced-tools.zip -d .

      - name: Build Advanced Tools
        working-directory: nexkit-advanced-tools
        run: |
          npm install
          VITE_BASE_PATH=/nexkit/tools/ VITE_NEXKIT_HOME_URL=/nexkit/ npm run build

      - name: Integrate Advanced Tools
        run: |
          mkdir -p NeXkiT-React/public/tools
          cp -R nexkit-advanced-tools/dist/. NeXkiT-React/public/tools/

      - name: Build Main Website
        working-directory: NeXkiT-React
        run: |
          npm install
          npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: NeXkiT-React/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
